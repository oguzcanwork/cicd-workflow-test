name: "[SYNC] Branch Sync (prod→test→devx)"

on:
  pull_request:
    types: [closed]
    branches:
      - prod
      - test

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-prod-to-test:
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.base.ref == 'prod' &&
      github.event.pull_request.merged == true &&
      !startsWith(github.event.pull_request.head.ref, 'sync/')
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge prod into test
        id: merge
        run: |
          TARGET_BRANCH="test"
          SYNC_BRANCH="sync/prod-to-test-${{ github.run_id }}"
          HAS_CONFLICT=false

          git checkout $TARGET_BRANCH
          git pull origin $TARGET_BRANCH
          git checkout -b $SYNC_BRANCH

          if git merge origin/prod --no-ff -m "[SYNC] Merge prod to test (back-sync after PR #${{ github.event.pull_request.number }})"; then
            echo "Clean merge"
          else
            echo "Conflict detected — committing with markers for human review"
            git add -A
            GIT_EDITOR=true git merge --continue --no-edit
            HAS_CONFLICT=true
          fi

          git push origin $SYNC_BRANCH

          NEW_COMMIT_COUNT=$(git rev-list --count "origin/${TARGET_BRANCH}..${SYNC_BRANCH}" 2>/dev/null || echo "0")
          if [ "$NEW_COMMIT_COUNT" = "0" ]; then
            echo "SKIP_PR=true" >> $GITHUB_ENV
          fi

          echo "SYNC_BRANCH=$SYNC_BRANCH" >> $GITHUB_ENV
          echo "HAS_CONFLICT=$HAS_CONFLICT" >> $GITHUB_ENV

      - name: Create PR and merge (no conflicts)
        if: env.HAS_CONFLICT == 'false' && env.SKIP_PR != 'true'
        run: |
          PR_URL=$(gh pr create \
            --base "test" \
            --head "$SYNC_BRANCH" \
            --title "[SYNC] prod to test (PR #${{ github.event.pull_request.number }})" \
            --body "Automated merge PR #${{ github.event.pull_request.number }}")
          PR_NUMBER=$(echo $PR_URL | grep -oE '[0-9]+$')
          gh pr merge $PR_NUMBER --merge --delete-branch --admin
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Create PR and leave open (has conflicts)
        if: env.HAS_CONFLICT == 'true'
        run: |
          gh pr create \
            --base "test" \
            --head "$SYNC_BRANCH" \
            --title "[SYNC] prod to test (PR #${{ github.event.pull_request.number }}) - CONFLICT" \
            --body "## Conflict Detected

          Conflict markers committed. Resolve and push to this branch, then merge.

          \`\`\`bash
          git fetch origin
          git checkout $SYNC_BRANCH
          # resolve markers
          git add . && git commit -m 'resolve: conflict prod to test'
          git push
          \`\`\`"
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

  sync-test-to-devx:
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.base.ref == 'test' &&
      github.event.pull_request.merged == true &&
      !startsWith(github.event.pull_request.head.ref, 'sync/test-to-devx') &&
      !startsWith(github.event.pull_request.head.ref, 'release/')
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge test into devx
        id: merge
        run: |
          TARGET_BRANCH="devx"
          SYNC_BRANCH="sync/test-to-devx-${{ github.run_id }}"
          HAS_CONFLICT=false

          git checkout $TARGET_BRANCH
          git pull origin $TARGET_BRANCH
          git checkout -b $SYNC_BRANCH

          if git merge origin/test --no-ff -m "[SYNC] Merge test to devx (back-sync after PR #${{ github.event.pull_request.number }})"; then
            echo "Clean merge"
          else
            echo "Conflict detected — committing with markers for human review"
            git add -A
            GIT_EDITOR=true git merge --continue --no-edit
            HAS_CONFLICT=true
          fi

          git push origin $SYNC_BRANCH

          NEW_COMMIT_COUNT=$(git rev-list --count "origin/${TARGET_BRANCH}..${SYNC_BRANCH}" 2>/dev/null || echo "0")
          if [ "$NEW_COMMIT_COUNT" = "0" ]; then
            echo "SKIP_PR=true" >> $GITHUB_ENV
          fi

          echo "SYNC_BRANCH=$SYNC_BRANCH" >> $GITHUB_ENV
          echo "HAS_CONFLICT=$HAS_CONFLICT" >> $GITHUB_ENV

      - name: Create PR and merge (no conflicts)
        if: env.HAS_CONFLICT == 'false' && env.SKIP_PR != 'true'
        run: |
          PR_URL=$(gh pr create \
            --base "devx" \
            --head "$SYNC_BRANCH" \
            --title "[SYNC] test to devx (PR #${{ github.event.pull_request.number }})" \
            --body "Automated merge from PR #${{ github.event.pull_request.number }}")
          PR_NUMBER=$(echo $PR_URL | grep -oE '[0-9]+$')
          gh pr merge $PR_NUMBER --merge --delete-branch --admin
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Create PR and leave open (has conflicts)
        if: env.HAS_CONFLICT == 'true'
        run: |
          gh pr create \
            --base "devx" \
            --head "$SYNC_BRANCH" \
            --title "[SYNC] test to devx (PR #${{ github.event.pull_request.number }}) - CONFLICT" \
            --body "## Conflict Detected

          Conflict markers committed. Resolve and push, then merge this PR.
          After merge, sync continues automatically from this point forward.

          \`\`\`bash
          git fetch origin
          git checkout $SYNC_BRANCH
          # resolve markers — keep both sides where needed
          git add . && git commit -m 'resolve: conflict test to devx'
          git push
          \`\`\`"
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
